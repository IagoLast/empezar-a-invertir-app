appId: com.empezarainvertir.app
name: Quantity validation and maximum
---
- launchApp:
    clearState: true
    arguments:
      maestro-scenario: happy
- runFlow: ../shared/open-trade.yaml
- doubleTapOn:
    id: "trade-quantity"
- eraseText
- inputText: "0"
- tapOn: "Listo"
- scrollUntilVisible:
    element: "Introduce entre 1 y 100.000 unidades."
    direction: DOWN
- assertVisible:
    text: "Revisar orden"
    enabled: false
- scrollUntilVisible:
    element:
      id: "trade-quantity"
    direction: UP
- doubleTapOn:
    id: "trade-quantity"
- eraseText
- inputText: "100"
- tapOn: "Listo"
- scrollUntilVisible:
    element: "Saldo disponible insuficiente. Reduce la cantidad."
    direction: DOWN
- assertVisible:
    text: "Revisar orden"
    enabled: false
- scrollUntilVisible:
    element: "Usar máximo · 99 unidades"
    direction: UP
- tapOn: "Usar máximo · 99 unidades"
- scrollUntilVisible:
    element: "Revisar orden"
    direction: DOWN
- tapOn: "Revisar orden"
- tapOn: "Confirmar orden virtual"
- assertVisible: "Orden en marcha"
- tapOn: "Listo"
- extendedWaitUntil:
    visible: "Tu inversión · 99 unidades"
    timeout: 45000
- tapOn: "Cartera"
- assertVisible: '99,00.*'
