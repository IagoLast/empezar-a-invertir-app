appId: com.empezarainvertir.app
name: Buy and sell update the portfolio
---
- launchApp:
    clearState: true
    arguments:
      maestro-scenario: happy
- runFlow: ../shared/open-buy.yaml
- tapOn: "Confirmar orden virtual"
- assertVisible: "Orden en marcha"
- tapOn: "Listo"
- extendedWaitUntil:
    visible:
      id: "detail-sell"
      enabled: true
    timeout: 45000
- assertVisible:
    id: "detail-sell"
    enabled: true
- tapOn: "Vender"
- scrollUntilVisible:
    element: "Revisar orden"
    direction: DOWN
    centerElement: true
- tapOn: "Revisar orden"
- tapOn: "Confirmar orden virtual"
- assertVisible: "Orden en marcha"
- tapOn: "Listo"
- extendedWaitUntil:
    visible:
      id: "detail-sell"
      enabled: false
    timeout: 45000
- tapOn: "Cartera"
- assertVisible: '9998,00.*'
- scrollUntilVisible:
    element: "Tu cartera empieza aquí"
    direction: DOWN
    centerElement: true
- tapOn: "Movimientos"
- assertVisible: "Compra de AAPL"
- assertVisible: "Venta de AAPL"
