appId: com.empezarainvertir.app
name: Sign out clears account state
---
- launchApp:
    clearState: true
    arguments:
      maestro-scenario: happy
- runFlow: ../shared/open-buy.yaml
- tapOn: "Confirmar orden virtual"
- assertVisible: "Orden en marcha"
- tapOn: "Listo"
- tapOn: "Cartera"
- tapOn:
    id: "open-profile"
- scrollUntilVisible:
    element: "Cerrar sesión"
    direction: DOWN
    centerElement: true
- tapOn: "Cerrar sesión"
# The seeded session skipped onboarding; signing out returns to it.
- tapOn:
    id: "skip-onboarding"
- assertVisible: "Mi cartera"
- assertVisible: '10.000,00.*'
- scrollUntilVisible:
    element: "Tu cartera empieza aquí"
    direction: DOWN
- tapOn: "Movimientos"
- assertVisible: "Aún no hay operaciones"
- tapOn: "Mercados"
- tapOn:
    id: "asset-search"
- inputText: "AAPL"
- tapOn:
    id: "asset-AAPL"
- assertVisible:
    id: "detail-buy"
- tapOn:
    id: "detail-buy"
- assertVisible:
    id: "sign-in-apple"
- assertNotVisible: "Comprar"
