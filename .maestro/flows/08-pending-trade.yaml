appId: com.empezarainvertir.app
name: Recover a pending trade without duplication
---
- launchApp:
    clearState: true
    arguments:
      maestro-scenario: trade-response-lost
- runFlow: ../shared/open-buy.yaml
- tapOn: "Confirmar orden virtual"
- assertVisible: "No se recibió la confirmación."
- assertNotVisible: "Orden en marcha"
- tapOn: "Cerrar"
- tapOn: "Cartera"
- tapOn: "Comprobar operación pendiente"
- assertVisible: "Operación confirmada. Tu cartera está actualizada."
- assertNotVisible: "Comprobar operación pendiente"
- extendedWaitUntil:
    visible: '9899,00.*'
    timeout: 45000
- scrollUntilVisible:
    element: "AAPL · 1 unidades"
    direction: DOWN
    timeout: 60000
- assertVisible: "AAPL · 1 unidades"
