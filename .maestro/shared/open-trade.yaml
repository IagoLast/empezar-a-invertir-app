appId: com.empezarainvertir.app
---
- assertVisible: "Mi cartera"
- tapOn: "Comprar activos"
- tapOn:
    id: "asset-search"
- inputText: "AAPL"
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "asset-AAPL"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "asset-AAPL"
- tapOn:
    id: "detail-buy"
- assertVisible:
    id: "trade-quantity"
