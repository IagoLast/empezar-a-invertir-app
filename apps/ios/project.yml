name: Empezar
options:
  bundleIdPrefix: com.empezarainvertir
  deploymentTarget:
    iOS: "17.0"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Empezar:
    type: application
    platform: iOS
    sources:
      - path: Empezar
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.empezarainvertir.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Empezar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  EmpezarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EmpezarTests
    dependencies:
      - target: Empezar
schemes:
  Empezar:
    build:
      targets:
        Empezar: all
    test:
      targets:
        - EmpezarTests
