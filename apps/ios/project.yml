name: Empezar
options:
  bundleIdPrefix: com.empezarainvertir
  deploymentTarget:
    iOS: "17.0"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.43.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "V4XXJ25N99"
targets:
  Empezar:
    type: application
    platform: iOS
    info:
      path: Empezar/Info.plist
      properties:
        CFBundleDisplayName: EAI
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.empezarainvertir.auth
            CFBundleURLSchemes:
              - empezar
    entitlements:
      path: Empezar/Empezar.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    sources:
      - path: Empezar
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.empezarainvertir.app
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: $(EMPEZAR_PROFILE_UUID)
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  EmpezarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EmpezarTests
    dependencies:
      - target: Empezar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  EmpezarAuthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EmpezarAuthUITests
    dependencies:
      - target: Empezar
    settings:
      base:
        TEST_TARGET_NAME: Empezar
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Empezar:
    build:
      targets:
        Empezar: all
    test:
      targets:
        - EmpezarTests
        - EmpezarAuthUITests
