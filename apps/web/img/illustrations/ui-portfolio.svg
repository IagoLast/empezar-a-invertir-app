<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 720" role="img" aria-labelledby="ui-portfolio-title">
  <title id="ui-portfolio-title">Pantalla de cartera de la app con saldo virtual y posiciones</title>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="340" height="720" fill="var(--surface, #FFFFFF)" stroke="none"/>

    <!-- status bar -->
    <text x="26" y="36" font-size="13" font-weight="600" fill="currentColor" stroke="none">9:41</text>
    <path d="M262 32 h10" stroke-width="3"/>
    <path d="M278 28 v8 M284 26 v12 M290 23 v16"/>
    <rect x="300" y="24" width="26" height="13" rx="4"/>
    <rect x="303" y="27" width="17" height="7" rx="2" fill="currentColor" stroke="none"/>

    <!-- title -->
    <text x="24" y="88" font-size="25" font-weight="700" fill="currentColor" stroke="none" letter-spacing="-0.6">Mi cartera</text>

    <!-- balance -->
    <rect x="24" y="106" width="292" height="124" rx="22" fill="var(--pale, #EAF1FF)" stroke="none"/>
    <text x="44" y="138" font-size="11" font-weight="700" fill="var(--accent, #165DDE)" stroke="none" letter-spacing="1">SALDO VIRTUAL</text>
    <text x="44" y="176" font-size="27" font-weight="700" fill="currentColor" stroke="none" letter-spacing="-0.6">10.000,00 US$</text>
    <text x="44" y="202" font-size="13" fill="var(--muted, #596A84)" stroke="none">Dinero ficticio para practicar</text>

    <!-- actions -->
    <rect x="24" y="246" width="140" height="46" rx="16" fill="var(--button, #1757E0)" stroke="none"/>
    <text x="94" y="275" font-size="14" font-weight="600" fill="#FFFFFF" stroke="none" text-anchor="middle">Comprar acciones</text>
    <rect x="176" y="246" width="140" height="46" rx="16" stroke="var(--line, #DDE7F5)"/>
    <text x="246" y="275" font-size="14" font-weight="600" fill="currentColor" stroke="none" text-anchor="middle">Añadir saldo</text>

    <!-- positions -->
    <text x="24" y="330" font-size="11" font-weight="700" fill="var(--muted, #596A84)" stroke="none" letter-spacing="1">TUS ACTIVOS</text>

    <rect x="24" y="346" width="42" height="42" rx="14" fill="var(--pale, #EAF1FF)" stroke="none"/>
    <text x="45" y="373" font-size="15" font-weight="700" fill="var(--accent, #165DDE)" stroke="none" text-anchor="middle">A</text>
    <text x="78" y="364" font-size="15" font-weight="600" fill="currentColor" stroke="none">Apple</text>
    <text x="78" y="382" font-size="12" fill="var(--muted, #596A84)" stroke="none">4 unidades · AAPL</text>
    <text x="316" y="364" font-size="15" font-weight="600" fill="currentColor" stroke="none" text-anchor="end">1.024,40 US$</text>
    <text x="316" y="382" font-size="12" font-weight="600" fill="var(--gain, #087C60)" stroke="none" text-anchor="end">+1,82 %</text>

    <rect x="24" y="404" width="42" height="42" rx="14" fill="var(--pale, #EAF1FF)" stroke="none"/>
    <text x="45" y="431" font-size="14" font-weight="700" fill="var(--accent, #165DDE)" stroke="none" text-anchor="middle">€</text>
    <text x="78" y="422" font-size="15" font-weight="600" fill="currentColor" stroke="none">MSCI World</text>
    <text x="78" y="440" font-size="12" fill="var(--muted, #596A84)" stroke="none">12 unidades · IWDA</text>
    <text x="316" y="422" font-size="15" font-weight="600" fill="currentColor" stroke="none" text-anchor="end">986,10 US$</text>
    <text x="316" y="440" font-size="12" font-weight="600" fill="var(--loss, #BD3349)" stroke="none" text-anchor="end">−0,64 %</text>

    <rect x="24" y="462" width="42" height="42" rx="14" fill="var(--pale, #EAF1FF)" stroke="none"/>
    <text x="45" y="489" font-size="14" font-weight="700" fill="var(--accent, #165DDE)" stroke="none" text-anchor="middle">S</text>
    <text x="78" y="480" font-size="15" font-weight="600" fill="currentColor" stroke="none">S&amp;P 500</text>
    <text x="78" y="498" font-size="12" fill="var(--muted, #596A84)" stroke="none">8 unidades · VUSA</text>
    <text x="316" y="480" font-size="15" font-weight="600" fill="currentColor" stroke="none" text-anchor="end">742,80 US$</text>
    <text x="316" y="498" font-size="12" font-weight="600" fill="var(--gain, #087C60)" stroke="none" text-anchor="end">+0,41 %</text>

    <rect x="24" y="524" width="292" height="52" rx="18" fill="var(--pale, #EAF1FF)" stroke="none"/>
    <text x="44" y="547" font-size="12" font-weight="600" fill="var(--accent, #165DDE)" stroke="none">SALDO DISPONIBLE</text>
    <text x="44" y="566" font-size="13" fill="currentColor" stroke="none">7.246,70 US$ para practicar</text>

    <!-- tab bar -->
    <path d="M0 646 H340" stroke="var(--line, #DDE7F5)"/>
    <circle cx="48" cy="677" r="11" fill="var(--accent, #165DDE)" stroke="none"/>
    <text x="48" y="706" font-size="10" font-weight="600" fill="var(--accent, #165DDE)" stroke="none" text-anchor="middle">Cartera</text>
    <circle cx="132" cy="677" r="11"/>
    <text x="132" y="706" font-size="10" fill="var(--muted, #596A84)" stroke="none" text-anchor="middle">Mercados</text>
    <path d="M212 668 h16 M212 677 h16 M212 686 h16" stroke-width="2.4"/>
    <text x="220" y="706" font-size="10" fill="var(--muted, #596A84)" stroke="none" text-anchor="middle">Movimientos</text>
    <path d="M294 670 h14 a3 3 0 0 1 3 3 v13 a3 3 0 0 1 -3 3 h-14 a3 3 0 0 1 -3 -3 v-13 a3 3 0 0 1 3 -3 z M296 670 v-4 h10 v4"/>
    <text x="300" y="706" font-size="10" fill="var(--muted, #596A84)" stroke="none" text-anchor="middle">Aprender</text>
  </g>
</svg>
